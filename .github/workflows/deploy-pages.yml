name: Deploy Next.js preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Generate MDX collections
        run: npx fumadocs-mdx

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        env:
          NEXT_PUBLIC_DEPLOYED_SHA: ${{ github.sha }}
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          touch out/.nojekyll
          if [ -f out/404/index.html ]; then cp out/404/index.html out/404.html; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4